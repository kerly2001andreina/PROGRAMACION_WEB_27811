<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario interno</title>
    
    <style>
        #txtArea, #lblNombre{
            display: block;
            margin-bottom: 10px;
        }
        h1{
            color:rgba(240, 248, 255, 0.982);
            
        }
        label,footer{
            color: aliceblue;
        }    
    
        body{
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            text-align: center;
            background-image: url(../public/images/6mCHhus.jpg);
            /* backdrop-filter: blur(1px); */
            background-size: cover;
        }

        /* Hacer que el main ocupe el espacio disponible entre header y footer */
        main{
            flex: 1 0 auto;
        }

        #boton{
            background-color: beige;
            color: black;
            border-radius: 10px;
            padding: 10px;
        }

        
    </style>
</head>
<body>
    <header>
        <h1>Formulario interno</h1>
    </header>
    <main>
        <form action="datos_salida.html" method="get">
            <label for="nombre" id="lblNombre">Ingrese su nombre:</label>
            <input type="text" name="nombre" id="nombre">
            <br>
            <hr>
            <label for="mensaje" id="txtArea">Escriba un mensaje:</label>
            <textarea name="mensaje" id="mensaje"></textarea>
            <br>
            <hr>
            <label for="opciones">Seleccione una materia</label>
            <select name="opciones" id="opciones">
                <option value="" disabled selected>Seleccione una opción</option>
                <option value="programacion_web">Programacion Web</option>
                <option value="computacion_digital">Computacion Digital</option>
                <option value="sistemas_bases_datos">Sistema de Bases de Datos</option>
            </select>
            <br>
            <hr>
            <label for="checkbox">Acepto los términos y condiciones</label>
            <input type="checkbox" name="checkbox" id="checkbox">
            <br>
            <hr>
            <label>Seleccione su genero:</label>
            <input type="radio" name="radio" id="radio1" value="masculino">
            <label for="radio1">Masculino</label>
            <input type="radio" name="radio" id="radio2" value="femenino">
            <label for="radio2">Femenino</label>
            <br>
            <hr>
            <input type="submit" value="Enviar" id="boton" >
        </form>
    </main>
    <footer>
        
        <p>© 2025 Formulario Interno. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
