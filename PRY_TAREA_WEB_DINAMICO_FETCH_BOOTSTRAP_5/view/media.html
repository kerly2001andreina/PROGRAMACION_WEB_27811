<section class="container py-5">
  <h2 class="mb-4">Multimedia: Imagen, Video y Audio</h2>

  <div class="row mb-5">
    <div class="col-md-4">
      <h5>Imagen</h5>
      <img src="./media/foto.jpg" alt="Imagen de ejemplo" class="img-fluid rounded-3">
    </div>
    <div class="col-md-4">
      <h5>Video</h5>
      <video controls width="100%" preload="metadata">
        <source src="./media/video.mp4" type="video/mp4">
        Tu navegador no soporta video.
      </video>
    </div>
    <div class="col-md-4">
      <h5>Audio</h5>
      <audio controls preload="metadata">
        <source src="./media/Drama.mp3" type="audio/mpeg">
      </audio>
    </div>
  </div>

  <h3>Lista de elementos multimedia (tabla)</h3>
  <div class="table-responsive">
    <table class="table table-bordered">
      <thead class="table-light">
        <tr>
          <th>Tipo</th>
          <th>Vista previa</th>
          <th>Archivo</th>
          <th>Descripción</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Imagen</td>
          <td><img src="./media/foto.jpg" alt="img" style="max-width:120px;"></td>
          <td>item1.jpg</td>
          <td>Imagen de ejemplo del catálogo</td>
        </tr>
        <tr>
          <td>Video</td>
          <td><video width="160" controls><source src="./media/video.mp4" type="video/mp4"></video></td>
          <td>sample-video.mp4</td>
          <td>Video demo</td>
        </tr>
        <tr>
          <td>Audio</td>
          <td><audio controls><source src="./media/Drama.mp3" type="audio/mpeg"></audio></td>
          <td>sample-audio.mp3</td>
          <td>Clip de audio demo</td>
        </tr>
      </tbody>
      <tfoot class="table-light">
        <tr>
          <td colspan="4">Total elementos: 3</td>
        </tr>
      </tfoot>
    </table>
  </div>
</section>
